  <!--
    The site logo from SiteHeader.tsx as a standalone icon: a 36px tile with a 10px
    corner radius and "Ai" in Crimson Pro bold italic (17px), drawn as outlines so the
    icon needs no font.

    The colors are the accent and on-accent tokens from globals.css: the dark theme by
    default, the light theme when the browser prefers it, as the site does with no saved
    choice. favicon.ico is the same logo in the dark colors, for browsers that skip SVG
    icons. tests/icons.test.ts checks these colors against globals.css.
  -->
  <style>
