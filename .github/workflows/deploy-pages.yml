name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned to the image every earlier deploy ran on. `ubuntu-latest` moved to
    # 26.04, and the first two deploys on it stalled in the Pages queue.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      # With a warm cache the audit request is the only network call npm ci
      # makes, and nothing here uses its result. Skipping it leaves the install
      # with nothing to wait on outside the runner.
      - run: npm ci --no-audit

      - run: npm test

      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub times a Pages deployment out after 10 minutes. A shorter
          # limit here can cancel a deployment the service would still finish,
          # and a cancelled one cannot be deployed again for the same commit:
          # that commit needs a new push.
          timeout: 600000
